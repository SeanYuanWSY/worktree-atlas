name: Build development DMG
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: swift test
      - run: ./script/package_release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WorktreeAtlas-DMG-${{ runner.arch }}-not-notarized
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
